<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>GIK339 - Övning 2</title>
    <style>
      :root {
        --purple: #4b2582;
        --purple-lighter: hsl(from var(--purple) h s calc(l * 2.5));
        --pink: #e50075;
        --blue: #0071c2;
        --green: #007b3c;
        --green-lighter: hsl(from var(--green) h s calc(l * 2.5));
        --yellow: #ffdd00;
        --red: #e4003a;
      }
      body {
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande',
          'Lucida Sans', Arial, sans-serif;
      }
      .page__title {
        text-transform: uppercase;
        font-weight: normal;
      }
      .todo-list {
        padding: 1rem;

        padding-left: 0;
        margin: 0;
      }
      .todo-list__item {
        border-bottom: 1px solid var(--purple-lighter);
        font-size: 0.9rem;
        display: flex;
        flex-basis: 100%;
        justify-content: space-between;
        gap: 1rem;
        list-style-type: none;
      }
      .todo-list__item h3 {
        font-weight: semibold;
        text-align: left;
        flex: 1;
        text-transform: uppercase;
        color: var(--purple);
      }
      .todo-list__item--completed h3,
      .todo-list__item--completed p {
        text-decoration: line-through;
        color: gray;
      }
      .container {
        max-width: 50rem;
        margin: 0 auto;
      }
      .form-group {
        display: flex;
        justify-content: left;
        margin-bottom: 0.3rem;
      }
      .form-group__label {
        width: 30%;
        padding: 0.3rem;
      }
      .form-group__input {
        width: 70%;
        padding: 0.3rem;
      }
      .form-group__button {
        margin-left: auto;
        padding: 0.3rem;
      }
    </style>
  </head>
  <div class="container">
    <div class="form-group">
      <label class="form-group__label" for="titleField">Uppgift: </label>
      <input class="form-group__input" id="titleField" type="text" />
    </div>
    <div class="form-group">
      <label class="form-group__label" for="dueDateField">Färdigt den: </label>
      <input class="form-group__input" id="dueDateField" type="date" />
    </div>
    <div class="form-group">
      <button id="addTaskButton" class="form-group__button">
        Skapa uppgift
      </button>
    </div>
  </div>
  <body>
    <script src="script.js"></script>
  </body>
</html>
