<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>GIK339 - Övning 3</title>
    <style>
      body {
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande',
          'Lucida Sans', Arial, sans-serif;
      }
      .container {
        max-width: 50rem;
        margin: 0 auto;
      }
      .form-group {
        display: flex;
        justify-content: left;
        margin-bottom: 0.3rem;
      }
      .form-group__label {
        width: 30%;
        padding: 0.3rem;
      }
      .form-group__input {
        width: 70%;
        padding: 0.3rem;
      }
      .form-group__button {
        margin-left: auto;
        padding: 0.3rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-group">
        <label class="form-group__label" for="titleField">Uppgift: </label>
        <input class="form-group__input" id="titleField" type="text" />
      </div>
      <div class="form-group">
        <label class="form-group__label" for="dueDateField"
          >Färdigt den:
        </label>
        <input class="form-group__input" id="dueDateField" type="date" />
      </div>
      <div class="form-group">
        <button id="addTaskButton" class="form-group__button">
          Skapa uppgift
        </button>
      </div>
    </div>

    <script src="script-extra.js"></script>
  </body>
</html>
