<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>Min todo-lista v.2</title>
    <style>
      :root {
        --purple: #4b2582;
        --purple-lighter: hsl(from var(--purple) h s calc(l * 2.5));
        --pink: #e50075;
        --blue: #0071c2;
        --green: #007b3c;
        --green-lighter: hsl(from var(--green) h s calc(l * 2.5));
        --yellow: #ffdd00;
        --red: #e4003a;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .page__title {
        text-transform: uppercase;
        font-weight: normal;
      }
      .todo-list {
        padding: 1rem;
        padding-left: 0;
        width: 55%;
        margin: 0;
      }
      .todo-list__item {
        border-bottom: 1px solid var(--purple-lighter);
        font-size: 0.9rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        list-style-type: none;
      }
      .todo-list__item h3 {
        font-weight: semibold;
        text-transform: uppercase;
        color: var(--purple);
      }
      .todo-list__item--completed h3,
      .todo-list__item--completed p {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>

  <body>
    <script src="script-extra.js"></script>
  </body>
</html>
