<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>GIK339 - Övning 6 - Bootstrap</title>
  </head>
  <body class="text-lg text-gray-700">
    <div
      class="w-xl mx-auto my-7 border border-purple-100 shadow-md rounded-lg p-5">
      <div class="mx-3 mb-3 flex">
        <label class="mr-2 basis-1/3" for="titleField">Uppgift: </label>
        <input
          class="border border-purple-100 rounded-md w-full py-1 px-3"
          id="titleField"
          type="text" />
      </div>
      <div class="mx-3 mb-5 flex">
        <label class="mr-2 basis-1/3" for="dueDateField">Färdigt den: </label>
        <input
          class="border border-purple-100 rounded-md w-full py-1 px-3"
          id="dueDateField"
          type="date" />
      </div>
      <div class="mx-3">
        <button
          id="addTaskButton"
          class="text-white py-1 px-3 rounded-md border-1 border-purple-400 bg-purple-600 hover:bg-purple-500 cursor-pointer">
          Skapa uppgift
        </button>
      </div>
    </div>

    <script src="script-tailwind.js"></script>
  </body>
</html>
