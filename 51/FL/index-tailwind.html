<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>FL6 - CSS-ramverk - Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      header {
        padding: 1rem;
        border-bottom: 1px solid #ccc;
      }
      .page {
        margin: 3rem auto;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        padding: 2rem;
      }
      .page-title {
        margin-bottom: 1rem;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header><h1 class="text-clifford">En sida som visar hälsningar</h1></header>
    <main class="page" id="list">
      <h2 class="page-title">Hälsningar</h2>
      <section class="border rounded-md border-gray-300 w-[286px] mb-4">
        <img
          src="https://placehold.co/286x180?text=Hälsning+1+bild"
          alt="Placeholder-bild 1" />
        <div class="p-4">
          <h3 class="text-2xl mb-2">Hälsning 1 titel</h3>
          <p>Hälsing 1</p>
        </div>
      </section>
      <section class="border rounded-md border-gray-300 w-[286px] mb-4">
        <img
          class="w-100"
          src="https://placehold.co/286x180?text=Hälsning+2+bild"
          alt="Placeholder-bild 2" />
        <div class="p-4">
          <h3 class="text-2xl mb-2">Hälsning 2 titel</h3>
          <p>Hälsing 2 text</p>
        </div>
      </section>
    </main>
    <main class="page" id="create">
      <h2>Skapa ny hälsning</h2>
      <form id="greetings">
        <div class="mb-3">
          <label for="message">Meddelande</label>
          <input type="text" id="message" />
        </div>
        <button
          class="bg-blue-300 hover:bg-blue-200 px-4 py-1 border border-blue-400 rounded-md cursor-pointer"
          type="submit">
          Skicka
        </button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
