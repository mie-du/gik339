<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>FL6 - CSS-ramverk - Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <style>
      header {
        padding: 1rem;
        border-bottom: 1px solid #ccc;
      }
      .page {
        margin: 3rem auto;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        padding: 2rem;
      }
      .page-title {
        margin-bottom: 1rem;
      }

      .hidden {
        display: none;
      }

      .card {
        margin-bottom: 1rem;
        width: 18rem;
      }
    </style>
  </head>
  <body>
    <header><h1>En sida som visar hälsningar</h1></header>
    <main class="page container-sm" id="list">
      <h2 class="page-title">Hälsningar</h2>
      <section class="card">
        <img
          src="https://placehold.co/286x180?text=Hälsning+1+bild"
          class="card-img-top"
          alt="Placeholder-bild 1" />
        <div class="card-body">
          <h3 class="card-title">Hälsning 1 titel</h3>
          <p class="">Hälsing 1</p>
        </div>
      </section>
      <section class="card primary">
        <img
          src="https://placehold.co/286x180?text=Hälsning+2+bild"
          class="card-img-top"
          alt="Placeholder-bild 2" />
        <div class="card-body">
          <h3 class="card-title">Hälsning 2 titel</h3>
          <p class="">Hälsing 2 text</p>
        </div>
      </section>
    </main>
    <main class="page container-sm" id="create">
      <h2 class="page-title">Skapa ny hälsning</h2>
      <form id="greetings">
        <div class="mb-3">
          <label for="message" class="form-label">Meddelande</label>
          <input type="text" class="form-control" id="message" />
        </div>
        <button type="submit" class="btn btn-primary">Skicka</button>
      </form>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
